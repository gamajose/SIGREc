spring:
  application:
    name: sigrec-tfd-apac
  datasource:
    url: jdbc:postgresql://${DB_HOST:192.168.28.128}:${DB_PORT:5432}/${DB_NAME:segrec}
    username: ${DB_USER:jose}
    password: ${DB_PASSWORD:Joseluiz1}
  flyway:
    schemas: regulacao_tfd
    default-schema: regulacao_tfd
  thymeleaf:
    cache: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  uploads:
    tickets-dir: uploads/tickets
server:
  servlet:
    session:
      timeout: 30m
  error:
    include-message: never
sigrec:
  storage-path: ${SIGREC_STORAGE_PATH:./storage}
  open-browser: ${SIGREC_OPEN_BROWSER:false}
  desktop: ${SIGREC_DESKTOP:true}
  jwt-secret: ${SIGREC_JWT_SECRET:troque-este-segredo-em-producao-com-32-caracteres}
  jwt-expiration-minutes: ${SIGREC_JWT_EXPIRATION_MINUTES:480}
  mail-from: ${SIGREC_MAIL_FROM:no-reply@sigrec.local}
  mail-enabled: ${SIGREC_MAIL_ENABLED:false}
