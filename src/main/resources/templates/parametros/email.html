package templates.parametros;

<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Configuração de E-mail')}"></head>

<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<div th:replace="~{layout/fragments :: profileModal}"></div>

<main class="page">
    <div th:replace="~{layout/fragments :: alerts}"></div>

    <h1 class="h3">Configuração de e-mail</h1>

    <div class="panel">
        <form class="row g-3" method="post" th:action="@{/parametros/email}">
            <div class="col-md-6">
                <label class="form-label">Servidor SMTP</label>
                <input class="form-control"
                       name="host"
                       th:value="${email.host}"
                       placeholder="smtp.exemplo.com">
            </div>

            <div class="col-md-2">
                <label class="form-label">Porta</label>
                <input class="form-control"
                       name="porta"
                       th:value="${email.porta}"
                       placeholder="587">
            </div>

            <div class="col-md-4">
                <label class="form-label">Remetente</label>
                <input class="form-control"
                       name="remetente"
                       th:value="${email.remetente}"
                       placeholder="no-reply@exemplo.com">
            </div>

            <div class="col-md-6">
                <label class="form-label">Usuário SMTP</label>
                <input class="form-control"
                       name="usuario"
                       th:value="${email.usuario}"
                       placeholder="usuario@exemplo.com">
            </div>

            <div class="col-md-6">
                <label class="form-label">Senha SMTP</label>
                <input class="form-control"
                       name="senha"
                       type="password"
                       th:value="${email.senha}"
                       placeholder="Senha do e-mail">
            </div>

            <div class="col-md-3 form-check mt-4">
                <input class="form-check-input"
                       type="checkbox"
                       name="ativo"
                       th:checked="${email.ativo}">
                <label class="form-check-label">Ativar envio de e-mail</label>
            </div>

            <div class="col-md-3 form-check mt-4">
                <input class="form-check-input"
                       type="checkbox"
                       name="usar_tls"
                       th:checked="${email.usar_tls}">
                <label class="form-check-label">Usar TLS</label>
            </div>

            <div class="col-md-12">
                <button class="btn btn-success">Salvar configuração</button>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
