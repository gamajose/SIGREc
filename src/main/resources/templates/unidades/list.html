<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Unidades')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<div th:replace="~{layout/fragments :: profileModal}"></div>
<main class="page">
  <div th:replace="~{layout/fragments :: alerts}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <span class="eyebrow">Cadastros</span>
      <h1 class="h3 mb-1">Unidades</h1>
      <p class="text-muted mb-0">Consulte unidades por nome, CNES, município, tipo e UF.</p>
    </div>
    <button class="btn btn-success" type="button" data-bs-toggle="modal" data-bs-target="#novaUnidadeModal" th:if="${adminLogado}">Nova unidade</button>
  </div>

  <form class="panel mb-3" method="get" th:action="@{/unidades}">
    <div class="row g-2 align-items-end">
      <div class="col-md-4"><label class="form-label">Buscar</label><input class="form-control" name="q" th:value="${q}" placeholder="Nome, CNES ou município"></div>
      <div class="col-md-3"><label class="form-label">Tipo</label><select class="form-select" name="tipo"><option value="">Todos</option><option th:each="t:${tiposUnidade}" th:value="${t.tipo_unidade}" th:text="${t.tipo_unidade}" th:selected="${t.tipo_unidade == tipo}"></option></select></div>
      <div class="col-md-2"><label class="form-label">UF</label><select class="form-select" name="uf"><option value="">Todas</option><option th:each="u:${ufsUnidade}" th:value="${u.uf}" th:text="${u.uf}" th:selected="${u.uf == uf}"></option></select></div>
      <div class="col-md-2 d-grid"><button class="btn btn-success">Filtrar</button></div>
      <div class="col-md-1 d-grid"><a class="btn btn-outline-secondary" th:href="@{/unidades}">Limpar</a></div>
    </div>
  </form>

  <div class="panel">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="text-muted small">Total: <strong th:text="${totalRegistros}">0</strong> unidade(s)</span>
      <span class="text-muted small">Página <strong th:text="${page}">1</strong> de <strong th:text="${totalPaginas}">1</strong></span>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead><tr><th>#</th><th>Nome</th><th>CNES</th><th>Município</th><th>UF</th><th>Tipo</th><th>Responsável</th><th>Status</th></tr></thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(itens)}"><td colspan="8" class="text-center text-muted py-4">Nenhuma unidade encontrada.</td></tr>
          <tr th:each="i : ${itens}">
            <td th:text="${i.numero}">1</td>
            <td th:text="${i.nome}">Nome</td>
            <td th:text="${i.cnes}">CNES</td>
            <td th:text="${i.municipio}">Município</td>
            <td th:text="${i.uf}">UF</td>
            <td th:text="${i.tipo_unidade}">Tipo</td>
            <td th:text="${i.responsavel}">Responsável</td>
            <td><span class="badge" th:classappend="${i.ativo} ? ' bg-success' : ' bg-secondary'" th:text="${i.ativo ? 'Ativa' : 'Inativa'}">Ativa</span></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-3">
      <a class="btn btn-outline-secondary btn-sm" th:classappend="${!temAnterior} ? ' disabled'" th:href="@{/unidades(q=${q},tipo=${tipo},uf=${uf},page=${page - 1})}">Anterior</a>
      <a class="btn btn-outline-secondary btn-sm" th:classappend="${!temProxima} ? ' disabled'" th:href="@{/unidades(q=${q},tipo=${tipo},uf=${uf},page=${page + 1})}">Próxima</a>
    </div>
  </div>
</main>

<div class="modal fade" id="novaUnidadeModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <form class="sigrec-validated-form" method="post" th:action="@{/unidades}">
        <div class="modal-header"><h5 class="modal-title">Nova unidade</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
        <div class="modal-body"><div class="row g-2">
          <div class="col-md-6"><input class="form-control" name="nome" placeholder="Nome do estabelecimento" required></div>
          <div class="col-md-3"><input class="form-control" name="cnes" placeholder="CNES" inputmode="numeric" autocomplete="off" data-cnes-lookup></div>
          <div class="col-md-3"><input class="form-control" name="telefone" placeholder="Telefone" inputmode="numeric" autocomplete="off" data-mask="phone" data-digits="11"></div>
          <div class="col-md-5"><input class="form-control" name="municipio" placeholder="Município" required></div>
          <div class="col-md-2"><input class="form-control" name="uf" placeholder="UF" maxlength="2" required></div>
          <div class="col-md-5"><select class="form-select" name="tipo_unidade"><option value="SOLICITANTE">Solicitante</option><option value="AUTORIZADORA">Autorizadora</option><option value="AMBAS">Ambas</option></select></div>
          <div class="col-md-12"><input class="form-control" name="responsavel" placeholder="Responsável"></div>
        </div></div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-success">Salvar</button></div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
