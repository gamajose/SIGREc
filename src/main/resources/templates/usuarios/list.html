<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<div th:replace="~{layout/fragments :: profileModal}"></div>

<main class="page">
  <div th:replace="~{layout/fragments :: alerts}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <span class="eyebrow">Configurações</span>
      <h1 class="h3 mb-1">Usuários e permissões</h1>
      <p class="text-muted mb-0">Gerencie acessos, perfis e vínculo dos usuários às unidades.</p>
    </div>
    <button class="btn btn-success" type="button" data-bs-toggle="modal" data-bs-target="#novoUsuarioModal">Criar novo usuário</button>
  </div>

  <div class="panel">
    <table class="table align-middle">
      <thead><tr><th>Usuário</th><th>E-mail</th><th>Unidade</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>
        <tr th:each="u:${usuarios}">
          <form method="post" th:action="@{/usuarios/{id}(id=${u.id})}">
            <td>
              <strong th:text="${u.nome != null ? u.nome : u.username}">Nome</strong>
              <div class="small text-muted">
                <span th:text="${u.username}">usuario</span>
                <span th:if="${u.codigo_usuario != null and u.codigo_usuario != ''}"> · Código: <span th:text="${u.codigo_usuario}"></span></span>
              </div>
            </td>
            <td><input class="form-control form-control-sm" name="email" th:value="${u.email}"></td>
            <td>
              <select class="form-select form-select-sm" name="unidade_id">
                <option value="">Sem unidade</option>
                <option th:each="un:${unidades}" th:value="${un.id}" th:text="${un.nome}" th:selected="${un.id == u.unidade_id}"></option>
              </select>
            </td>
            <td>
              <select class="form-select form-select-sm" name="role">
                <option th:each="r:${roles}" th:value="${r}" th:selected="${r.name() == u.role}" th:text="${r.name()}"></option>
              </select>
            </td>
            <td class="text-nowrap"><input class="form-check-input" type="checkbox" name="ativo" th:checked="${u.ativo}"> Ativo</td>
            <td class="text-nowrap">
              <input class="form-control form-control-sm mb-1" name="senha" type="password" placeholder="Nova senha">
              <button class="btn btn-sm btn-outline-success">Salvar</button>
          </form>
          <form method="post" th:action="@{/usuarios/{id}/delete(id=${u.id})}" class="d-inline">
            <button class="btn btn-sm btn-outline-danger">Excluir</button>
          </form>
            </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<div class="modal fade" id="novoUsuarioModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <form class="sigrec-validated-form" method="post" th:action="@{/usuarios}">
        <div class="modal-header">
          <h5 class="modal-title">Criar novo usuário</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <h6 class="mb-2">Dados de acesso</h6>
          <div class="row g-2 mb-3">
            <div class="col-md-6"><input class="form-control" name="nome" placeholder="Nome completo" required></div>
            <div class="col-md-3"><input class="form-control" name="username" placeholder="Username/login" required></div>
            <div class="col-md-3"><input class="form-control" name="email" type="email" placeholder="E-mail"></div>
            <div class="col-md-3"><input class="form-control" name="telefone" placeholder="Telefone" inputmode="numeric" autocomplete="off" data-mask="phone" data-digits="11"></div>
            <div class="col-md-3"><input class="form-control" name="senha" type="password" placeholder="Senha inicial" required></div>
            <div class="col-md-3"><select class="form-select" name="unidade_id"><option value="">Unidade vinculada</option><option th:each="u:${unidades}" th:value="${u.id}" th:text="${u.nome}"></option></select></div>
            <div class="col-md-3"><select class="form-select" name="role" required><option value="SOLICITANTE">Solicitante</option><option value="REGULADOR">Regulador</option><option value="ADMIN">Admin</option></select></div>
          </div>
          <h6 class="mb-2">Dados da unidade do usuário</h6>
          <div class="row g-2">
            <div class="col-md-3"><input class="form-control" name="unidade_telefone" placeholder="Telefone da unidade" inputmode="numeric" autocomplete="off" data-mask="phone" data-digits="11"></div>
            <div class="col-md-3"><input class="form-control" name="unidade_cep" placeholder="CEP da unidade" inputmode="numeric" autocomplete="off" data-mask="cep" data-digits="8" data-cep-lookup></div>
            <div class="col-md-4"><input class="form-control" name="unidade_endereco" data-cep-logradouro placeholder="Rua da unidade"></div>
            <div class="col-md-2"><input class="form-control" name="unidade_numero" placeholder="Número"></div>
            <div class="col-md-4"><input class="form-control" name="unidade_bairro" data-cep-bairro placeholder="Bairro"></div>
            <div class="col-md-4"><input class="form-control" name="municipio" data-cep-municipio placeholder="Cidade"></div>
            <div class="col-md-2"><input class="form-control" name="uf" data-cep-uf placeholder="UF" maxlength="2"></div>
            <div class="col-md-6"><input class="form-control" name="unidade_complemento" placeholder="Complemento"></div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-success">Criar usuário</button></div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
