<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/fragments :: head('Usuarios')}"></head>
    <body><nav th:replace="~{layout/fragments :: nav}"></nav>
        <main class="page">
            <div th:replace="~{layout/fragments :: alerts}"></div>
            <h1 class="h3">Usuarios e permissoes</h1>
            <div class="panel mb-3">
                <form class="row g-2" method="post" th:action="@{/usuarios}">
                    <div class="col-md-2"><input class="form-control" name="username" placeholder="Usuario" required></div>
                    <div class="col-md-3"><input class="form-control" name="email" type="email" placeholder="E-mail"></div>
                    <div class="col-md-2"><input class="form-control" name="senha" type="password" placeholder="Senha inicial" required></div>
                    <div class="col-md-3"><select class="form-select" name="unidade_id"><option value="">Unidade</option><option th:each="u:${unidades}" th:value="${u.id}" th:text="${u.nome}"></option></select></div>
                    <div class="col-md-2">
                        <select class="form-select" name="role" required>
                            <option value="SOLICITANTE">Solicitante</option>
                            <option value="REGULADOR">Regulador</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>
                    <div class="col-md-1"><button class="btn btn-success w-100">Criar</button></div>
                </form>
            </div>
            <div class="panel">
                <table class="table">
                    <thead><tr><th>Usuario</th><th>E-mail</th><th>Unidade</th><th>Perfil</th><th>Status</th><th>Acoes</th></tr></thead>
                    <tbody>
                        <tr th:each="u:${usuarios}">
                    <form method="post" th:action="@{/usuarios/{id}(id=${u.id})}">
                        <td th:text="${u.username}"></td>
                        <td><input class="form-control form-control-sm" name="email" th:value="${u.email}"></td>
                        <td><select class="form-select form-select-sm" name="unidade_id"><option value="">Sem unidade</option><option th:each="un:${unidades}" th:value="${un.id}" th:text="${un.nome}" th:selected="${un.id == u.unidade_id}"></option></select></td>
                        <td>
                            <select class="form-select form-select-sm" name="role">
                                <option th:each="r:${roles}"
                                        th:value="${r}"
                                        th:selected="${r.name() == u.role}"
                                        th:text="${r.name() == 'SOLICITANTE' ? 'SOLICITANTE' : r.name()}">
                                </option>
                            </select>
                        </td>
                        <td class="text-nowrap"><input class="form-check-input" type="checkbox" name="ativo" th:checked="${u.ativo}"> Ativo</td>
                        <td class="text-nowrap">
                            <input class="form-control form-control-sm mb-1" name="senha" type="password" placeholder="Nova senha">
                            <button class="btn btn-sm btn-outline-success">Salvar</button>
                    </form>
                    <form method="post" th:action="@{/usuarios/{id}/delete(id=${u.id})}" class="d-inline"><button class="btn btn-sm btn-outline-danger">Excluir</button></form>
                    </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
