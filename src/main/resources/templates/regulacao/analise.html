<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/fragments :: head('Analise de regulacao')}"></head>
    <body><nav th:replace="~{layout/fragments :: nav}"></nav>
        <main class="page">
            <div th:replace="~{layout/fragments :: alerts}"></div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div><h1 class="h3 mb-1" th:text="${solicitacao.numero_protocolo}">Protocolo</h1><p class="text-secondary mb-0" th:text="${solicitacao.paciente_nome + ' - ' + solicitacao.tipo_solicitacao}"></p></div>
                <a class="btn btn-outline-secondary" th:href="@{/solicitacoes/{id}(id=${solicitacao.id})}">Ver detalhe</a>
            </div>
            <div class="row g-3">
                <div class="col-lg-7">
                    <div class="panel">
                        <h2 class="h5">Resumo para decisao</h2>
                        <dl class="row">
                            <dt class="col-sm-3">Status</dt><dd class="col-sm-9" th:text="${solicitacao.status}"></dd>
                            <dt class="col-sm-3">Prioridade</dt><dd class="col-sm-9" th:text="${solicitacao.prioridade}"></dd>
                            <dt class="col-sm-3">Unidade</dt><dd class="col-sm-9" th:text="${solicitacao.unidade_nome}"></dd>
                            <dt class="col-sm-3">Procedimento</dt><dd class="col-sm-9" th:text="${(solicitacao.procedimento_codigo ?: '') + ' - ' + (solicitacao.procedimento_descricao ?: '')}"></dd>
                            <dt class="col-sm-3">Diagnostico</dt><dd class="col-sm-9" th:text="${solicitacao.descricao_diagnostico}"></dd>
                            <dt class="col-sm-3">Justificativa</dt><dd class="col-sm-9" th:text="${solicitacao.justificativa}"></dd>
                        </dl>
                    </div>
                    <div class="panel mt-3">
                        <h2 class="h5">Historico regulatorio</h2>
                        <table class="table">
                            <thead><tr><th>Data</th><th>Usuario</th><th>Acao</th><th>Status</th><th>Observacao</th></tr></thead>
                            <tbody><tr th:each="h:${historico}"><td th:text="${h.criado_em}"></td><td th:text="${h.usuario_nome}"></td><td th:text="${h.acao}"></td><td th:text="${(h.status_anterior ?: '') + ' -> ' + (h.status_novo ?: '')}"></td><td th:text="${h.observacao}"></td></tr></tbody>
                        </table>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="panel">
                        <h2 class="h5">Decisão da regulação</h2>

                        <form method="post"
                              th:action="@{/regulacao/{id}/status(id=${solicitacao.id})}"
                              class="mb-3">

                            <input type="hidden" name="novo_status" value="AUTORIZADA">

                            <label class="form-label">Autorizador</label>
                            <select class="form-select mb-2" name="profissional_autorizador_id">
                                <option value="">Selecione quando autorizar</option>
                                <option th:each="p:${autorizadores}"
                                        th:value="${p.id}"
                                        th:text="${p.nome}">
                                </option>
                            </select>

                            <div class="row g-2">
                                <div class="col-md-6">
                                    <input class="form-control"
                                           name="numero_autorizacao"
                                           placeholder="Numero autorizacao">
                                </div>

                                <div class="col-md-6">
                                    <input class="form-control"
                                           name="numero_apac"
                                           placeholder="Numero APAC">
                                </div>

                                <div class="col-md-6">
                                    <input class="form-control"
                                           type="date"
                                           name="validade_inicio">
                                </div>

                                <div class="col-md-6">
                                    <input class="form-control"
                                           type="date"
                                           name="validade_fim">
                                </div>
                            </div>

                            <label class="form-label mt-2">Observação da aprovação</label>
                            <textarea class="form-control mb-3"
                                      name="observacao"
                                      placeholder="Informe a observação da aprovação"></textarea>

                            <button class="btn btn-success w-100">
                                Aprovar solicitação
                            </button>
                        </form>

                        <hr>

                        <form method="post"
                              th:action="@{/regulacao/{id}/status(id=${solicitacao.id})}"
                              class="mb-3">

                            <input type="hidden" name="novo_status" value="INDEFERIDA">

                            <label class="form-label">Motivo da reprovação</label>
                            <textarea class="form-control mb-3"
                                      name="observacao"
                                      required
                                      placeholder="Informe o motivo da reprovação"></textarea>

                            <button class="btn btn-outline-danger w-100">
                                Reprovar solicitação
                            </button>
                        </form>

                        <form method="post"
                              th:action="@{/regulacao/{id}/status(id=${solicitacao.id})}">

                            <input type="hidden" name="novo_status" value="DEVOLVIDA_CORRECAO">

                            <label class="form-label">Motivo da devolução para correção</label>
                            <textarea class="form-control mb-3"
                                      name="observacao"
                                      required
                                      placeholder="Informe o que precisa ser corrigido"></textarea>

                            <button class="btn btn-outline-warning w-100">
                                Devolver para correção
                            </button>
                        </form>
                    </div>
                    <div class="panel mt-3">
                        <h2 class="h5">Documento</h2>
                        <p class="text-secondary">A impressao e a reimpressao ficam registradas no historico da solicitacao.</p>
                        <a class="btn btn-success" target="_blank" th:href="@{/impressao/{id}(id=${solicitacao.id})}">Gerar PDF preenchido</a>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
