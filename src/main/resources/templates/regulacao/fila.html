<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Fila de regulacao')}"></head>
<body><nav th:replace="~{layout/fragments :: nav}"></nav>
<main class="page">
  <div th:replace="~{layout/fragments :: alerts}"></div>
  <h1 class="h3">Fila de regulacao</h1>
  <div class="panel mb-3">
    <form class="row g-2" method="get">
      <div class="col-md-2"><select class="form-select" name="tipo"><option value="">Tipo</option><option th:selected="${tipo=='TFD'}">TFD</option><option th:selected="${tipo=='APAC'}">APAC</option></select></div>
      <div class="col-md-3"><select class="form-select" name="status"><option value="">Status</option><option th:each="s : ${statusSolicitacao}" th:value="${s}" th:text="${s}" th:selected="${status==s}"></option></select></div>
      <div class="col-md-5"><input class="form-control" name="q" th:value="${q}" placeholder="Paciente, protocolo ou procedimento"></div>
      <div class="col-md-2"><button class="btn btn-outline-success w-100">Filtrar</button></div>
    </form>
  </div>
  <div class="panel">
    <table class="table table-hover">
      <thead><tr><th>Protocolo</th><th>Tipo</th><th>Paciente</th><th>Unidade</th><th>Procedimento</th><th>Prioridade</th><th>Status</th><th></th></tr></thead>
      <tbody><tr th:each="s : ${itens}">
        <td th:text="${s.numero_protocolo}"></td><td th:text="${s.tipo_solicitacao}"></td>
        <td th:text="${s.paciente_nome}"></td><td th:text="${s.unidade_nome}"></td>
        <td><span th:text="${s.procedimento_codigo}"></span><div class="small text-secondary" th:text="${s.procedimento_descricao}"></div></td>
        <td><span class="badge" th:classappend="'priority-' + ${s.prioridade}" th:text="${s.prioridade}"></span></td>
        <td th:text="${s.status}"></td>
        <td><a class="btn btn-sm btn-success" th:href="@{/regulacao/{id}(id=${s.id})}">Analisar</a></td>
      </tr></tbody>
    </table>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
