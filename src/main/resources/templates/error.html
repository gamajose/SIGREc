<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Erro - SIGREc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<main class="page py-4">
    <section class="panel">
        <h1 class="h3 text-danger">Ops, ocorreu um erro</h1>

        <p class="text-secondary mb-3">
            Não foi possível concluir a operação solicitada.
        </p>

        <div class="alert alert-warning">
            <strong>Status:</strong>
            <span th:text="${status ?: 500}">500</span>
            <br>
            <strong>Mensagem:</strong>
            <span th:text="${message ?: error ?: 'Erro interno'}">Erro interno</span>
        </div>

        <div class="alert alert-light border" th:if="${erroDetalhado != null}">
            <strong>Detalhe técnico:</strong>
            <span th:text="${erroDetalhado}"></span>
        </div>

        <a class="btn btn-outline-secondary" th:href="@{/}">
            Voltar para o início
        </a>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
