<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Tickets')}"></head>
<body><nav th:replace="~{layout/fragments :: nav}"></nav>
<main class="page">
  <div th:replace="~{layout/fragments :: alerts}"></div>
  <h1 class="h3">Tickets de suporte</h1>
  <script th:if="${ticketsAbertos > 0}">
    window.addEventListener('load', function () {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 880;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(function () { osc.stop(); ctx.close(); }, 450);
      } catch (e) {}
    });
  </script>
  <div class="panel">
    <table class="table table-hover">
      <thead><tr><th>Data</th><th>Usuario</th><th>Assunto</th><th>Mensagem</th><th>Status</th><th>Responder</th></tr></thead>
      <tbody><tr th:each="t:${tickets}">
        <td th:text="${t.criado_em}"></td>
        <td><span th:text="${t.username}"></span><div class="small text-secondary" th:text="${t.email}"></div></td>
        <td th:text="${t.assunto}"></td>
        <td th:text="${t.mensagem}"></td>
        <td th:text="${t.status}"></td>
        <td>
          <form th:if="${t.status == 'ABERTO'}" method="post" th:action="@{/tickets/{id}/responder(id=${t.id})}">
            <textarea class="form-control form-control-sm mb-1" name="resposta" required></textarea>
            <button class="btn btn-sm btn-success">Resolver</button>
          </form>
          <span th:if="${t.status != 'ABERTO'}" th:text="${t.resposta}"></span>
        </td>
      </tr></tbody>
    </table>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
