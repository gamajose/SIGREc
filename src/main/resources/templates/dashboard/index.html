<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>
<div th:replace="~{layout/fragments :: profileModal}"></div>

<main class="page">
  <div th:replace="~{layout/fragments :: alerts}"></div>

  <section class="page-hero mb-3">
    <div>
      <span class="eyebrow">Painel operacional</span>
      <h1 class="page-title mb-1">Fila TFD/APAC</h1>
      <p class="page-subtitle mb-0">Entrada, análise, autorização, impressão e histórico regulatório.</p>
    </div>
    <div class="page-actions btn-group">
      <a class="btn btn-success" th:href="@{/solicitacoes/nova/TFD}">Nova TFD</a>
      <a class="btn btn-outline-success" th:href="@{/solicitacoes/nova/APAC}">Nova APAC</a>
    </div>
  </section>

  <section class="row g-3 mb-4">
    <div class="col-md-3" th:each="c : ${contadores}">
      <div class="panel h-100">
        <div class="text-secondary small" th:text="${c.status}">STATUS</div>
        <div class="display-6" th:text="${c.total}">0</div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
