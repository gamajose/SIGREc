<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' - SIGREc'">SIGREc</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg topbar">
  <div class="container-fluid page py-2">
    <a class="navbar-brand brand-mark" th:href="@{/}">SIGREc TFD/APAC</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/solicitacoes}">Solicitacoes</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/regulacao/fila}">Regulacao</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/pacientes}">Pacientes</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/unidades}">Unidades</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/profissionais}">Profissionais</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/procedimentos}">Procedimentos</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/relatorios}">Relatorios</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/usuarios}">Usuarios</a></li>
      </ul>
      <span class="navbar-text me-3" th:text="${usuarioLogado}"></span>
      <form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary btn-sm">Sair</button></form>
    </div>
  </div>
</nav>
<div th:fragment="alerts">
  <div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
  <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
</div>
</body>
</html>
