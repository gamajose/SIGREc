<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/fragments :: head('Procedimentos')}"></head>

    <body>
        <nav th:replace="~{layout/fragments :: nav}"></nav>
<div th:replace="~{layout/fragments :: profileModal}"></div>

        <main class="page">
            <div th:replace="~{layout/fragments :: alerts}"></div>

            <h1 class="h3">Procedimentos</h1>

            <div class="panel mb-3">
                <form class="row g-2 mb-3" method="get">
                    <div class="col-md-8">
                        <input class="form-control"
                               name="q"
                               th:value="${q}"
                               placeholder="Codigo ou descricao">
                    </div>

                    <div class="col-md-2">
                        <select class="form-control" name="origem">
                            <option value="" th:selected="${origem == ''}">Todas origens</option>
                            <option value="SIGTAP" th:selected="${origem == 'SIGTAP'}">SIGTAP</option>
                            <option value="manual" th:selected="${origem == 'manual'}">Manual</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <button class="btn btn-outline-success w-100">
                            Buscar
                        </button>
                    </div>
                </form>

                <form class="row g-2" method="post" th:action="@{/procedimentos}" th:if="${adminLogado or reguladorLogado}">
                    <div class="col-md-2">
                        <input class="form-control"
                               name="codigo"
                               placeholder="Codigo"
                               required>
                    </div>

                    <div class="col-md-6">
                        <input class="form-control"
                               name="descricao"
                               placeholder="Descricao"
                               required>
                    </div>

                    <div class="col-md-2">
                        <input class="form-control"
                               name="tipo"
                               placeholder="Tipo">
                    </div>

                    <div class="col-md-1">
                        <input class="form-control"
                               name="valor"
                               placeholder="Valor">
                    </div>

                    <div class="col-md-1">
                        <button class="btn btn-success w-100">
                            Salvar
                        </button>
                    </div>
                </form>
            </div>

            <div class="panel">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Codigo</th>
                            <th>Descricao</th>
                            <th>Tipo</th>
                            <th>Valor</th>
                            <th>Origem</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="i : ${itens}">
                            <td th:text="${i.codigo}"></td>
                            <td th:text="${i.descricao}"></td>
                            <td th:text="${i.tipo}"></td>
                            <td th:text="${i.valor}"></td>
                            <td th:text="${i.origem}"></td>
                            <td th:text="${i.ativo ? 'Ativo' : 'Inativo'}"></td>

<!--                            <td>
                                <form th:if="${i.id_local != null}"
                                      method="post"
                                      th:action="@{'/procedimentos/' + ${i.id_local} + '/toggle'}">
                                    <button class="btn btn-sm btn-outline-secondary">
                                        Alternar
                                    </button>
                                </form>

                                <span th:if="${i.id_local == null}" class="text-muted">
                                    SIGTAP
                                </span>
                            </td>-->
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
