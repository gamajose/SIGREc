<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Relatorios')}"></head>
<body><nav th:replace="~{layout/fragments :: nav}"></nav>
<div th:replace="~{layout/fragments :: profileModal}"></div>
<main class="page">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3">Relatorios</h1>
    <div class="btn-group">
      <a class="btn btn-outline-success" th:href="@{/relatorios/fila.csv}">Exportar CSV</a>
      <a class="btn btn-success" target="_blank" th:href="@{/relatorios/fila.pdf}">Salvar/imprimir PDF</a>
    </div>
  </div>
  <div class="row g-3">
    <div class="col-md-4"><div class="panel"><h2 class="h5">Fila por status</h2><table class="table"><tr th:each="r:${porStatus}"><td th:text="${r.status}"></td><td th:text="${r.total}"></td></tr></table></div></div>
    <div class="col-md-4"><div class="panel"><h2 class="h5">Fila por unidade</h2><table class="table"><tr th:each="r:${porUnidade}"><td th:text="${r.unidade}"></td><td th:text="${r.total}"></td></tr></table></div></div>
    <div class="col-md-4"><div class="panel"><h2 class="h5">Tempo medio ate autorizacao</h2><table class="table"><tr th:each="r:${tempoMedio}"><td th:text="${r.tipo_solicitacao}"></td><td th:text="${r.horas + ' h'}"></td></tr></table></div></div>
  </div>
  <div class="panel mt-3">
    <h2 class="h5">Reimpressoes recentes</h2>
    <table class="table"><thead><tr><th>Protocolo</th><th>Paciente</th><th>Formulario</th><th>Usuario</th><th>Data</th></tr></thead>
      <tbody><tr th:each="r:${reimpressoes}"><td th:text="${r.numero_protocolo}"></td><td th:text="${r.paciente}"></td><td th:text="${r.tipo_formulario}"></td><td th:text="${r.usuario}"></td><td th:text="${r.criado_em}"></td></tr></tbody>
    </table>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
