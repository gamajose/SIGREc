<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Impressão da solicitação')}"></head>
<body>
<nav th:replace="~{layout/fragments :: nav}"></nav>

<main class="page">
  <section class="page-hero mb-3 no-print">
    <div>
      <span class="eyebrow">Impressão</span>
      <h1 class="page-title mb-1">Impressão da solicitação</h1>
      <p class="page-subtitle mb-0">Clique em baixar PDF para realizar o download do documento.</p>
    </div>
    <div class="page-actions btn-group">
      <a class="btn btn-success" th:href="@{/impressao/{id}(id=${solicitacao['id']})}">Baixar PDF</a>
      <a class="btn btn-outline-secondary" th:href="@{/solicitacoes/{id}(id=${solicitacao['id']})}">Voltar</a>
    </div>
  </section>

  <section class="panel">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div>
        <h2 class="h4 mb-1">SIGREc TFD/APAC</h2>
        <p class="text-muted mb-0">Comprovante de solicitação/autorização</p>
      </div>
      <div class="text-end">
        <strong>Protocolo</strong>
        <div th:text="${solicitacao['numero_solicitacao'] != null ? solicitacao['numero_solicitacao'] : solicitacao['numero_protocolo']}">SOL-000001</div>
      </div>
    </div>

    <hr>

    <h3 class="h5">Dados da solicitação</h3>
    <div class="row g-3 mb-3">
      <div class="col-md-3"><strong>Tipo:</strong><br><span th:text="${solicitacao['tipo_solicitacao']}">TFD</span></div>
      <div class="col-md-3"><strong>Status:</strong><br><span th:text="${solicitacao['status']}">AUTORIZADA</span></div>
      <div class="col-md-3"><strong>Prioridade:</strong><br><span th:text="${solicitacao['prioridade']}">NORMAL</span></div>
      <div class="col-md-3"><strong>Entrada:</strong><br><span th:text="${#strings.substring((solicitacao['data_entrada'] != null ? solicitacao['data_entrada'] : solicitacao['criado_em']).toString(), 0, 19)}">Data</span></div>
    </div>
  </section>
</main>

<style>
  @media print {
    .no-print, nav { display: none !important; }
    body { background: #fff !important; }
    .page { margin: 0 !important; padding: 0 !important; }
    .panel { border: 0 !important; box-shadow: none !important; }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
