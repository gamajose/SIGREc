<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Profissionais')}"></head>
<body><nav th:replace="~{layout/fragments :: nav}"></nav>
<div th:replace="~{layout/fragments :: profileModal}"></div>
<main class="page">
  <div th:replace="~{layout/fragments :: alerts}"></div>
  <h1 class="h3">Profissionais</h1>
  <div class="panel mb-3" th:if="${adminLogado or reguladorLogado or solicitanteLogado}">
    <form class="row g-2" method="post" th:action="@{/profissionais}">
      <div class="col-md-4"><input class="form-control" name="nome" placeholder="Nome" required></div>
      <div class="col-md-2"><input class="form-control" name="cpf_cns" placeholder="CPF/CNS"></div>
      <div class="col-md-1"><input class="form-control" name="conselho" placeholder="CRM"></div>
      <div class="col-md-2"><input class="form-control" name="registro_conselho" placeholder="Registro"></div>
      <div class="col-md-3"><input class="form-control" name="especialidade" placeholder="Especialidade"></div>
      <div class="col-md-6"><select class="form-select" name="unidade_id"><option value="">Unidade</option><option th:each="u:${unidades}" th:value="${u.id}" th:text="${u.nome}"></option></select></div>
      <div class="col-md-2 form-check mt-3" th:if="${adminLogado or reguladorLogado}"><input class="form-check-input" type="checkbox" name="solicitante" checked> <label class="form-check-label">Solicitante</label></div>
      <div class="col-md-2 form-check mt-3" th:if="${adminLogado or reguladorLogado}"><input class="form-check-input" type="checkbox" name="autorizador"> <label class="form-check-label">Autorizador</label></div>
      <input type="hidden" name="solicitante" value="on" th:if="${solicitanteLogado and !adminLogado and !reguladorLogado}">
      <div class="col-md-2"><button class="btn btn-success w-100">Salvar</button></div>
    </form>
  </div>
  <div class="panel"><table class="table"><thead><tr><th>Nome</th><th>Documento</th><th>Conselho</th><th>Especialidade</th><th>Unidade</th><th>Atuacao</th></tr></thead>
    <tbody><tr th:each="i : ${itens}"><td th:text="${i.nome}"></td><td th:text="${i.cpf_cns}"></td><td th:text="${i.conselho + ' ' + i.registro_conselho}"></td><td th:text="${i.especialidade}"></td><td th:text="${i.unidade_nome}"></td><td th:text="${(i.solicitante ? 'Solicitante ' : '') + (i.autorizador ? 'Autorizador' : '')}"></td></tr></tbody>
  </table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
